name: Convert SVG to PNG

on:
  push:
    branches: [ auth-diagram/png ]
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install librsvg
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Convert SVG to PNG
        run: |
          mkdir -p docs
          rsvg-convert docs/auth-diagram.svg -w 1000 -h 1400 -o docs/auth-diagram.png

      - name: Commit and push PNG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/auth-diagram.png
          git commit -m "Add authentication diagram PNG (generated)" || echo "No changes to commit"
          git push origin HEAD:auth-diagram/png
